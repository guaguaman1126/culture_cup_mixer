<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>地政好蚌蚌混音器</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header class="topbar">
    <a class="brand" href="#player-view" aria-label="回到播放介面">
      <span class="brand-mark">♪</span>
      <span>地政好蚌蚌混音器</span>
    </a>
    <button id="admin-toggle" class="ghost-button" type="button" aria-controls="admin-view"
      aria-expanded="false">管理介面</button>
  </header>

  <main class="app-shell">
    <section id="player-view" class="view">
      <section class="song-panel" aria-labelledby="song-title">
        <div class="song-panel-heading">
          <p id="song-year" class="meta-text">目前歌曲</p>
          <button id="song-picker-toggle" class="small-button" type="button" aria-expanded="false"
            aria-controls="song-picker-dialog">切換歌曲</button>
        </div>
        <h1 id="song-title">載入中</h1>
      </section>

      <section class="transport-panel" aria-label="播放控制">
        <div class="timeline-row">
          <span id="current-time">0:00</span>
          <input id="progress" type="range" min="0" max="0" value="0" step="0.1" aria-label="播放進度">
          <span id="duration">0:00</span>
        </div>

        <div class="button-row">
          <button id="backward" class="primary-button secondary" type="button">-5s</button>
          <button id="play-toggle" class="primary-button" type="button">播放</button>
          <button id="forward" class="primary-button secondary" type="button">+5s</button>
        </div>
      </section>

      <section class="tracks-section" aria-labelledby="tracks-heading">
        <div class="section-heading">
          <h2 id="tracks-heading">聲部音量</h2>
          <p id="player-status" class="status-text" role="status">等待歌曲資料</p>
          <button id="reset-volumes" class="small-button" type="button">重設音量 80%</button>
        </div>
        <div id="tracks-list" class="tracks-list"></div>
      </section>
    </section>

    <section id="admin-view" class="view is-hidden" aria-labelledby="admin-heading">
      <section class="admin-panel">
        <div class="section-heading">
          <div>
            <p class="meta-text">管理介面</p>
          </div>
        </div>

        <form id="current-song-form" class="upload-form">
          <h2>選擇置頂歌曲</h2>
            <select id="current-song-select" name="song_id"></select>
            <button class="primary-button secondary" type="submit">切換歌曲</button>
            <p id="current-song-status" class="status-text" role="status">正在讀取歌曲清單</p>
        </form>

        <section class="upload-form track-order-panel" aria-labelledby="track-order-heading">
          <h2 id="track-order-heading">聲部資訊</h2>
          <div id="track-order-list" class="track-order-list"></div>
          <button id="track-order-save" class="primary-button secondary" type="button">儲存聲部資訊</button>
          <p id="track-order-status" class="status-text" role="status">正在讀取聲部資訊</p>
        </section>

        <form id="upload-form" class="upload-form">

          <h2 id="admin-heading">上傳歌曲與聲部音檔</h2>



          <label>
            <span>歌曲名稱</span>
            <input id="admin-title" name="title" type="text" autocomplete="off" required>
          </label>

          <label>
            <span>聲部名稱</span>
            <input name="track_name" type="text" placeholder="例如 soprano、alto、tempo" autocomplete="off" required>
          </label>

          <label>
            <span>音檔</span>
            <input name="audio" type="file" accept="audio/*" required>
          </label>

          <button class="primary-button" type="submit">上傳</button>
          <p id="upload-status" class="status-text" role="status">尚未上傳</p>
        </form>
      </section>
    </section>
  </main>

  <dialog id="song-picker-dialog" class="song-picker-dialog">
    <section class="song-picker-form" aria-labelledby="song-picker-heading">
      <h2 id="song-picker-heading">切換歌曲</h2>
      <div id="song-picker" class="song-picker" aria-label="歌曲清單"></div>
      <p id="song-picker-status" class="status-text" role="status"></p>
      <div class="dialog-actions">
        <button id="song-picker-cancel" class="ghost-button" type="button">取消</button>
      </div>
    </section>
  </dialog>

  <dialog id="admin-password-dialog" class="password-dialog">
    <form id="admin-password-form" class="password-form">
      <h2>管理密碼</h2>
      <label>
        <span>請輸入管理密碼</span>
        <input id="admin-password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <div class="dialog-actions">
        <button id="admin-password-cancel" class="ghost-button" type="button">取消</button>
        <button class="primary-button" type="submit">進入</button>
      </div>
      <p id="admin-password-status" class="status-text" role="status"></p>
    </form>
  </dialog>

  <script src="sortable.min.js"></script>
  <script src="app.js"></script>
</body>

</html>
